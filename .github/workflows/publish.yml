name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      skip_npm:
        description: 'Skip npm publish (true = binary-only test run)'
        required: false
        default: 'false'

jobs:
  # Gate: run CLI tests before publishing anything
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run CLI unit tests
        run: pnpm --filter crewspace test

  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.ref_name }}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync CLI package version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'fs';
          const v = process.env.VERSION;
          const p = JSON.parse(readFileSync('packages/cli/package.json', 'utf8'));
          p.version = v;
          writeFileSync('packages/cli/package.json', JSON.stringify(p, null, 2) + '\n');
          console.log('CLI version →', v);
          EOF

      - name: Publish to npm
        if: github.event.inputs.skip_npm != 'true'
        run: pnpm --filter crewspace publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip npm publish notice
        if: github.event.inputs.skip_npm == 'true'
        run: echo "npm publish skipped (skip_npm=true)"

  build-binaries:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: test
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: ''
            sea_platform: linux
          - os: windows-latest
            target: windows-x64
            ext: '.exe'
            sea_platform: win32
          - os: macos-latest
            target: macos-universal
            ext: ''
            sea_platform: darwin

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Bundle CLI with esbuild
        shell: bash
        run: |
          npx --yes esbuild packages/cli/src/index.ts \
            --bundle \
            --platform=node \
            --format=cjs \
            --outfile=cli-bundle.cjs \
            --target=node22 \
            --banner:js="#!/usr/bin/env node"

      - name: Create Node SEA binary (Linux)
        if: matrix.sea_platform == 'linux'
        shell: bash
        run: |
          OUT="crewspace-${{ matrix.target }}"
          echo '{"main":"cli-bundle.cjs","output":"sea-prep.blob","disableExperimentalSEAWarning":true}' > sea-config.json
          node --experimental-sea-config sea-config.json
          cp "$(which node)" "$OUT"
          npx --yes postject "$OUT" NODE_SEA_BLOB sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          chmod +x "$OUT"
          echo "Built: $OUT ($(du -sh "$OUT" | cut -f1))"

      - name: Create Node SEA binary (macOS)
        if: matrix.sea_platform == 'darwin'
        shell: bash
        run: |
          OUT="crewspace-${{ matrix.target }}"
          echo '{"main":"cli-bundle.cjs","output":"sea-prep.blob","disableExperimentalSEAWarning":true}' > sea-config.json
          node --experimental-sea-config sea-config.json
          cp "$(which node)" "$OUT"
          codesign --remove-signature "$OUT"
          npx --yes postject "$OUT" NODE_SEA_BLOB sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            --macho-segment-name NODE_SEA
          codesign --sign - "$OUT"
          chmod +x "$OUT"
          echo "Built: $OUT ($(du -sh "$OUT" | cut -f1))"

      - name: Create Node SEA binary (Windows)
        if: matrix.sea_platform == 'win32'
        shell: pwsh
        run: |
          $OUT = "crewspace-${{ matrix.target }}.exe"
          '{"main":"cli-bundle.cjs","output":"sea-prep.blob","disableExperimentalSEAWarning":true}' | Out-File sea-config.json -Encoding utf8
          node --experimental-sea-config sea-config.json
          Copy-Item (Get-Command node).Source $OUT
          npx --yes postject $OUT NODE_SEA_BLOB sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          Write-Host "Built: $OUT ($([math]::Round((Get-Item $OUT).Length / 1MB, 1)) MB)"

      - name: Upload binary to GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          OUT="crewspace-${{ matrix.target }}${{ matrix.ext }}"
          gh release upload "$TAG" "$OUT" --clobber \
            || gh release create "$TAG" "$OUT" \
                 --title "CrewSpace $TAG" \
                 --notes "CLI release — install with: \`npm install -g crewspace\`" \
                 --latest

      - name: Upload binary artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: crewspace-${{ matrix.target }}
          path: crewspace-${{ matrix.target }}${{ matrix.ext }}
          retention-days: 7
