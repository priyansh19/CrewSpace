name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g. v0.1.0). Must match desktop-electron/package.json version.
        required: true
        type: string
      dry_run:
        description: Build without creating a GitHub Release
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Windows: build main app + installer wizard ──────────────────────────────
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install monorepo dependencies
        run: pnpm install --no-frozen-lockfile

      # Build all workspace packages (server, shared, adapters, db)
      - name: Build workspace packages
        run: pnpm -r --filter '!crewspace-desktop' build

      # Build the Electron renderer (React UI)
      - name: Build desktop renderer
        working-directory: desktop-electron
        run: pnpm run build:renderer

      # Package the main app as an unpacked directory (no NSIS yet —
      # we'll zip it and hand it to the installer wizard)
      - name: Build desktop app (unpacked)
        working-directory: desktop-electron
        run: pnpm exec electron-builder --win --dir --publish never

      # Zip the unpacked app as the installer payload
      - name: Create installer payload (app.zip)
        shell: pwsh
        run: |
          $src = "desktop-electron\dist\win-unpacked"
          $dst = "desktop-electron\installer\assets\payload\app.zip"
          New-Item -ItemType Directory -Force -Path (Split-Path $dst)
          Compress-Archive -Path "$src\*" -DestinationPath $dst -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item $dst).Length / 1MB, 1)
          Write-Host "Payload size: $mb MB"

      # Build the installer wizard renderer
      - name: Build installer wizard renderer
        working-directory: desktop-electron/installer
        run: pnpm run build

      # Package the installer wizard as a portable exe
      - name: Build installer wizard portable exe
        working-directory: desktop-electron/installer
        run: pnpm run build:app

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-wizard
          path: desktop-electron/installer/dist/CrewSpace-Setup-*.exe
          retention-days: 30

  # ── macOS: build DMG ────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install monorepo dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter '!crewspace-desktop' build

      - name: Build desktop renderer
        working-directory: desktop-electron
        run: pnpm run build:renderer

      - name: Build macOS DMG
        working-directory: desktop-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm exec electron-builder --mac dmg --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop-electron/dist/*.dmg
          retention-days: 30

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    if: ${{ inputs.dry_run != true && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-wizard
          path: dist/

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist/

      - name: Determine version tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          cat > /tmp/release-notes.md << 'EOF'
          ## CrewSpace Desktop

          Your AI company control plane — multi-agent orchestration, budget policies, approval gates, and a plugin ecosystem, all from a single desktop app.

          ### Downloads
          | Platform | File | Notes |
          |----------|------|-------|
          | Windows | `CrewSpace-Setup-*.exe` | Self-contained installer wizard |
          | macOS | `CrewSpace-*.dmg` | Drag to Applications |

          ### Installation
          **Windows:** Run `CrewSpace-Setup-*.exe`. The wizard will install the app and create desktop + Start Menu shortcuts. Your existing data (companies, agents, projects) is preserved across updates.

          **macOS:** Open the `.dmg` and drag CrewSpace to your Applications folder. If macOS says the app is "damaged", run this in Terminal and then open the app again:
          ```
          xattr -rd com.apple.quarantine /Applications/CrewSpace.app
          ```
          This is expected for apps that are not yet notarized with Apple.

          ### What's new
          - First public release
          - Multi-agent org chart with role-based hierarchy
          - Budget policies and cost tracking per agent
          - Approval gates for human-in-the-loop oversight
          - Plugin ecosystem with built-in plugin manager
          - Local-first: all data stays on your machine
          EOF
          gh release create "$tag" dist/*.exe dist/*.dmg \
            --title "CrewSpace Desktop $tag" \
            --notes-file /tmp/release-notes.md \
            --latest
