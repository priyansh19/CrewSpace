name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g. v0.1.0). Must match desktop-electron/package.json version.
        required: true
        type: string
      dry_run:
        description: Build without creating a GitHub Release
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
    branches:
      - 'release/*'

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Windows: build installer wizard + NSIS auto-update artifacts ────────────
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install monorepo dependencies
        run: pnpm install --no-frozen-lockfile

      # Build all workspace packages (server, shared, adapters, db)
      - name: Build workspace packages
        run: pnpm -r --filter '!crewspace-desktop' build

      # Stage the built server into desktop-electron/server-prod/ so that
      # electron-builder's `extraResources` ({from: "server-prod", to: "server"})
      # actually has something to copy into resources/server/. Without this step
      # the installed CrewSpace.exe throws "Server entry not found:
      # resources/server/dist/index.js" at startup and the main window never opens.
      - name: Prepare desktop server bundle
        run: node scripts/prepare-desktop-server.mjs

      # Generate proper multi-size ICO from source PNG using ImageMagick
      - name: Generate Windows ICO
        shell: pwsh
        run: |
          magick "desktop-electron/assets/icon.png" -define icon:auto-resize=256,128,64,48,32,16 "desktop-electron/assets/icon.ico"
          magick "desktop-electron/assets/icon.png" -define icon:auto-resize=256,128,64,48,32,16 "desktop-electron/installer/assets/icon.ico"

      # Sync installer wizard version with main desktop version so artifact names match
      - name: Sync installer version
        shell: pwsh
        run: |
          $ver = (Get-Content desktop-electron/package.json | ConvertFrom-Json).version
          $installerPkg = Get-Content desktop-electron/installer/package.json | ConvertFrom-Json
          $installerPkg.version = $ver
          $installerPkg | ConvertTo-Json -Depth 10 | Set-Content desktop-electron/installer/package.json
          Write-Host "Installer version set to $ver"

      # Build the Electron renderer (React UI)
      - name: Build desktop renderer
        working-directory: desktop-electron
        run: pnpm run build:renderer

      # Build NSIS installer — generates latest.yml + blockmap for electron-updater
      - name: Build NSIS installer
        working-directory: desktop-electron
        run: pnpm exec electron-builder --win nsis --publish never

      # Package the main app as an unpacked directory for the installer wizard payload
      - name: Build desktop app (unpacked)
        working-directory: desktop-electron
        run: pnpm exec electron-builder --win --dir --publish never

      # Zip the unpacked app as the installer wizard payload
      - name: Create installer payload (app.zip)
        shell: pwsh
        run: |
          $src = "desktop-electron\dist\win-unpacked"
          $dst = "desktop-electron\installer\assets\payload\app.zip"
          New-Item -ItemType Directory -Force -Path (Split-Path $dst)
          Compress-Archive -Path "$src\*" -DestinationPath $dst -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item $dst).Length / 1MB, 1)
          Write-Host "Payload size: $mb MB"

      # Build the installer wizard renderer
      - name: Build installer wizard renderer
        working-directory: desktop-electron/installer
        run: pnpm run build

      # Package the installer wizard as a portable exe
      - name: Build installer wizard portable exe
        working-directory: desktop-electron/installer
        run: pnpm run build:app

      - name: Upload Windows installer wizard artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-wizard
          path: desktop-electron/installer/dist/CrewSpace-Installer-*.exe
          retention-days: 30

      - name: Upload NSIS auto-update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: |
            desktop-electron/dist/CrewSpace-Setup-*.exe
            desktop-electron/dist/CrewSpace-Setup-*.exe.blockmap
            desktop-electron/dist/latest.yml
          retention-days: 30

  # ── macOS: build DMG ────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install monorepo dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter '!crewspace-desktop' build

      - name: Build desktop renderer
        working-directory: desktop-electron
        run: pnpm run build:renderer

      # Generate proper multi-resolution ICNS from source PNG using macOS tools
      - name: Generate macOS ICNS
        run: |
          mkdir -p desktop-electron/assets/icon.iconset
          sips -z 16   16   desktop-electron/assets/icon.png --out desktop-electron/assets/icon.iconset/icon_16x16.png
          sips -z 32   32   desktop-electron/assets/icon.png --out desktop-electron/assets/icon.iconset/icon_16x16@2x.png
          sips -z 32   32   desktop-electron/assets/icon.png --out desktop-electron/assets/icon.iconset/icon_32x32.png
          sips -z 64   64   desktop-electron/assets/icon.png --out desktop-electron/assets/icon.iconset/icon_32x32@2x.png
          sips -z 128  128  desktop-electron/assets/icon.png --out desktop-electron/assets/icon.iconset/icon_128x128.png
          sips -z 256  256  desktop-electron/assets/icon.png --out desktop-electron/assets/icon.iconset/icon_128x128@2x.png
          sips -z 256  256  desktop-electron/assets/icon.png --out desktop-electron/assets/icon.iconset/icon_256x256.png
          sips -z 512  512  desktop-electron/assets/icon.png --out desktop-electron/assets/icon.iconset/icon_256x256@2x.png
          sips -z 512  512  desktop-electron/assets/icon.png --out desktop-electron/assets/icon.iconset/icon_512x512.png
          sips -z 1024 1024 desktop-electron/assets/icon.png --out desktop-electron/assets/icon.iconset/icon_512x512@2x.png
          iconutil -c icns desktop-electron/assets/icon.iconset -o desktop-electron/assets/icon.icns
          rm -rf desktop-electron/assets/icon.iconset

      - name: Build macOS DMG
        working-directory: desktop-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm exec electron-builder --mac dmg --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop-electron/dist/*.dmg
          retention-days: 30

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    if: ${{ inputs.dry_run != true && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows installer wizard
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-wizard
          path: dist/

      - name: Download Windows NSIS auto-update artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: dist/

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist/

      - name: Determine version tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            # Triggered by release/* branch push — read version from package.json
            ver=$(node -p "require('./desktop-electron/package.json').version")
            echo "tag=v${ver}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          cat > /tmp/release-notes.md << 'EOF'
          ## CrewSpace Desktop

          Your AI company control plane — multi-agent orchestration, budget policies, approval gates, and a plugin ecosystem, all from a single desktop app.

          ### Downloads
          | Platform | File |
          |----------|------|
          | Windows | `CrewSpace-Installer-*.exe` |
          | macOS | `CrewSpace-*.dmg` |

          ### Installation
          **Windows:** Run `CrewSpace-Installer-*.exe`. The wizard will install the app and create desktop + Start Menu shortcuts. Your existing data is preserved across updates. Future updates are delivered automatically in-app.

          **macOS:** Open the `.dmg` and drag CrewSpace to your Applications folder. If macOS says the app is "damaged", run this in Terminal:
          ```
          xattr -rd com.apple.quarantine /Applications/CrewSpace.app
          ```

          ### What's new
          - Multi-agent org chart with role-based hierarchy
          - Budget policies and cost tracking per agent
          - Approval gates for human-in-the-loop oversight
          - Plugin ecosystem with built-in plugin manager
          - Local-first: all data stays on your machine
          EOF
          gh release create "$tag" dist/CrewSpace-Installer-*.exe dist/*.dmg dist/CrewSpace-Setup-*.exe dist/*.blockmap dist/latest.yml \
            --title "CrewSpace Desktop $tag" \
            --notes-file /tmp/release-notes.md \
            --latest
