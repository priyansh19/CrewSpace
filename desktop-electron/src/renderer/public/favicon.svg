<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#252538"/>
      <stop offset="100%" stop-color="#141422"/>
    </radialGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A07B"/>
      <stop offset="100%" stop-color="#E07A5F"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="24" height="24" rx="5" fill="url(#bg)"/>
  <!-- N bar -->
  <rect x="10.5" y="2" width="3" height="4.5" rx="1" fill="url(#bar)"/>
  <!-- S bar -->
  <rect x="10.5" y="17.5" width="3" height="4.5" rx="1" fill="url(#bar)"/>
  <!-- W bar -->
  <rect x="2" y="10.5" width="4.5" height="3" rx="1" fill="url(#bar)"/>
  <!-- E bar -->
  <rect x="17.5" y="10.5" width="4.5" height="3" rx="1" fill="url(#bar)"/>
  <!-- NE bar -->
  <rect x="15" y="3.5" width="2.5" height="5.5" rx="1" fill="url(#bar)" transform="rotate(45 16.25 6.25)"/>
  <!-- NW bar -->
  <rect x="6.5" y="3.5" width="2.5" height="5.5" rx="1" fill="url(#bar)" transform="rotate(-45 7.75 6.25)"/>
  <!-- SE bar -->
  <rect x="15" y="15" width="2.5" height="5.5" rx="1" fill="url(#bar)" transform="rotate(-45 16.25 17.75)"/>
  <!-- SW bar -->
  <rect x="6.5" y="15" width="2.5" height="5.5" rx="1" fill="url(#bar)" transform="rotate(45 7.75 17.75)"/>
  <!-- Terminal frame -->
  <rect x="7.5" y="7.5" width="9" height="9" rx="2" fill="#FFFFFF"/>
  <!-- Terminal screen -->
  <rect x="9" y="9.5" width="6" height="5.5" rx="1" fill="#141422"/>
  <!-- > prompt -->
  <polygon points="9.8,10.8 11.8,12 9.8,13.2 9.8,12.5 11,12 9.8,11.5" fill="#FFFFFF"/>
  <!-- _ cursor -->
  <rect x="12.2" y="13" width="1.8" height="0.8" rx="0.4" fill="#FFFFFF"/>
</svg>