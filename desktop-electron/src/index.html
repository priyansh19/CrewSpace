<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrewSpace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="card">
        <div class="brand">
          <svg class="mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="14" fill="#141413" />
            <path d="M16 6 L16 26 M6 16 L26 16" stroke="#faf9f5" stroke-width="2.5" stroke-linecap="round" />
            <path d="M9 9 L23 23 M23 9 L9 23" stroke="#faf9f5" stroke-width="2.5" stroke-linecap="round" />
          </svg>
          <h1 class="title">CrewSpace</h1>
        </div>

        <p class="subtitle">AI agent company control plane</p>

        <div class="status" id="status-container">
          <div class="spinner" id="spinner"></div>
          <span class="status-text" id="status-text">Starting server...</span>
        </div>

        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <p class="detail" id="detail">Initializing embedded database</p>
      </div>

      <footer class="footer">
        <span>On-premise · Private · Secure</span>
      </footer>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
